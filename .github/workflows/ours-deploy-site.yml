# OURS: deploy the kanosena.com homepage (static files in ours/site) to
# Cloudflare. Manual trigger only. Uses the same repository secrets as the app
# deploy. Details: ours/site/README.md
name: "Deploy homepage (ours)"

on:
  workflow_dispatch:

concurrency:
  group: ours-deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'calvin22580/postiz-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Deploy
        working-directory: ours/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy
